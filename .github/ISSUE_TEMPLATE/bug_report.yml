name: Bug report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Please don't include personal data, résumés, tokens or secrets. For security issues use the private advisory form instead."
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Steps to reproduce and what you expected. }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version / commit }
  - type: dropdown
    id: env
    attributes:
      label: Where?
      options: [Hosted JobFlow, Self-hosted on Cloudflare, Local development]
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Relevant logs (redacted), render: text }
