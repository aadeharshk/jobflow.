name: Deploy

# Manual, gated deployment. Configure GitHub Environments "staging" and "production"
# (Settings → Environments) with required reviewers and these secrets:
#   CLOUDFLARE_API_TOKEN  – token with Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit, Queues:Edit
#   CLOUDFLARE_ACCOUNT_ID
# Application secrets (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, TOKEN_ENCRYPTION_KEY) are stored in
# Cloudflare with `wrangler secret put`, never in GitHub.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  NPM_VERSION: "11.21.2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - name: Verify (lint, types, tests)
        run: npm run lint && npm run typecheck && npm test
      - name: Refuse placeholder resource IDs
        run: |
          if grep -q '00000000-0000-0000-0000-0000000000' wrangler.jsonc; then
            echo "::error::wrangler.jsonc still contains placeholder D1 IDs. Run scripts/setup-cloudflare.sh and commit the real IDs."; exit 1
          fi
      - run: npm run build:web
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ENV_FLAG=$([ "${{ inputs.environment }}" = "staging" ] && echo "--env staging" || echo "")
          npx wrangler d1 migrations apply DB_CORE --remote $ENV_FLAG
          npx wrangler d1 migrations apply DB_JOBS --remote $ENV_FLAG
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ENV_FLAG=$([ "${{ inputs.environment }}" = "staging" ] && echo "--env staging" || echo "")
          npx wrangler deploy $ENV_FLAG
      - name: Smoke test
        run: |
          URL=$(node -e "const fs=require('fs');const t=fs.readFileSync('wrangler.jsonc','utf8').replace(/^\s*\/\/.*$/gm,'');const c=JSON.parse(t);const e='${{ inputs.environment }}';console.log(e==='staging'?c.env.staging.vars.APP_URL:c.vars.APP_URL)")
          echo "Checking $URL/api/health"
          curl -fsS --retry 5 --retry-delay 5 "$URL/api/health"
